[project]
name = "ai-reviewer-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Reviewer PoC"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiogram>=3.22,<4",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "weasyprint>=66,<67",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
