[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avito-ai-consultant"
version = "0.1.0"
description = "Avito AI Consultant: детекция AI-генерации кода (ai_detector) и 3-этапный ревьюер домашних заданий (homework_reviewer)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "openai>=1.40",
    "aiofiles",
    "tenacity",
    "instructor>=1.0",
    "click>=8.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.10",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
homework-reviewer = "homework_reviewer.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_detector", "src/common", "src/core", "src/homework_reviewer"]

[dependency-groups]
dev = [
    "greenlet>=3.5.5",
    "httpx>=0.28.1",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff==0.15.14",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]
exclude = [".venv", "alembic"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # flake8
    "I",    # isort (импорты)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "RUF",  # ruff-specific rules
]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["ai_detector", "common", "core", "homework_reviewer"]

[tool.mypy]
python_version = "3.11"
strict = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=30",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
branch = true
concurrency = ["thread", "greenlet"]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_empty = true
