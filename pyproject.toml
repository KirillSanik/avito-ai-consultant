[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-detector"
version = "0.1.0"
description = "Асинхронный модуль детекции AI-генерации кода в репозиториях с решениями домашних заданий"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "openai>=1.40",
    "aiofiles",
    "tenacity",
    "httpx",
]

[dependency-groups]
dev = [
    "greenlet>=3.5.5",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]
exclude = [".venv", "alembic", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # flake8
    "I",    # isort (импорты)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "RUF",  # ruff-specific rules
]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["ai_detector"]

[tool.mypy]
python_version = "3.11"
strict = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=30",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
branch = true
concurrency = ["thread", "greenlet"]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_empty = true
